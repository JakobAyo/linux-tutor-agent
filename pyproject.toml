[project]
name = "shtutor"
version = "0.1.0"
description = "A shell tutor that writes discovery lessons from the commands you run."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual>=1.0"]

[project.scripts]
shtutor = "shtutor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
